; MRM_* 为本工程管理参数。空工具路径从 PATH 查找。
; 本机可用 envVar_v2.local.ini 覆盖本文件，不提交本机覆盖文件。
[envVar_all]
MRM_GIT_EXE =
MRM_NODE_EXE =
MRM_PNPM_EXE =
MRM_GIT_TIMEOUT_SECONDS = 30
MRM_NETWORK_TIMEOUT_SECONDS = 300
MRM_TASK_TIMEOUT_SECONDS = 900

[envVar_windows]
; 根据实际安装位置填写，Python 代码不包含固定安装路径。
MRM_DSH_DESKTOP_DIR = D:/app/DeepSeekHarnessDesktop
; 留空时使用上述目录下的 DeepSeek Harness.exe。
MRM_DSH_DESKTOP_EXE =
; 留空时使用当前用户目录下的 .dsh/profiles/desktop。
MRM_DSH_PROFILE_DIR =

[envVar_linux]
MRM_DSH_DESKTOP_DIR =
; Linux 须明确填写实际可执行文件路径。
MRM_DSH_DESKTOP_EXE =
MRM_DSH_PROFILE_DIR =
